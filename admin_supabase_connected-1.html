<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ГРОЗА — управление контентом</title><style>body{font:16px system-ui;background:#0d1216;color:#f2f5f6;margin:0;padding:24px}main{max-width:650px;margin:auto}h1{color:#edb263}label{display:block;margin:18px 0 8px}input,textarea{box-sizing:border-box;width:100%;padding:12px;background:#1b242b;color:#fff;border:1px solid #53606b;border-radius:8px;font:inherit}textarea{min-height:105px}button{background:#edb263;color:#20180f;border:0;border-radius:8px;padding:12px 18px;margin:12px 8px 0 0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap;color:#e7c99b}section{border:1px solid #38434c;border-radius:12px;padding:20px;margin-top:18px}.muted{color:#aab5bd;font-size:13px}</style></head><body><main><h1>ГРОЗА · Панель администратора</h1><p class="muted">Управление публичными текстами и ссылками. Не предназначено для оперативного оповещения об угрозах.</p><section id="config"><h2>Подключение</h2><label>Supabase Project URL<input id="url" value="https://ipsvxvkyogyjatdxwbuv.supabase.co" placeholder="https://xxxxx.supabase.co"></label><label>Publishable / anon key<input id="key" value="sb_publishable_HPxZogczmYmwVTh4b6_qXg_BVbxs06H" placeholder="sb_publishable_..." type="password"></label><button id="connect">Подключиться</button><p class="muted">Вводите только публичный publishable/anon ключ. Никогда не используйте secret или service_role.</p></section><section id="auth" hidden><h2>Вход</h2><label>Email<input id="email" type="email" autocomplete="username"></label><label>Пароль<input id="password" type="password" autocomplete="current-password"></label><button id="login">Войти</button><button id="logout" hidden>Выйти</button></section><section id="editor" hidden><h2>Контент сайта</h2><label>Заголовок<input id="title" maxlength="80"></label><label>Информационное сообщение<textarea id="notice" maxlength="500"></textarea></label><label>Название ссылки 1<input id="name1" maxlength="50"></label><label>URL ссылки 1<input id="link1" type="url"></label><label>Название ссылки 2<input id="name2" maxlength="50"></label><label>URL ссылки 2<input id="link2" type="url"></label><button id="save">Опубликовать изменения</button></section><p id="status" role="status"></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const $=id=>document.getElementById(id);let client;
const status=s=>$('status').textContent=s;
const validUrl=s=>{if(!s)return '';const u=new URL(s);if(!['https:','http:'].includes(u.protocol))throw Error('Ссылка должна начинаться с https:// или http://');return u.href};
$('connect').onclick=async()=>{try{const url=$('url').value.trim(),key=$('key').value.trim();if(!/^https:\/\/[\w-]+\.supabase\.co\/?$/.test(url)||!key)throw Error('Проверьте URL и публичный ключ');client=createClient(url,key);$('auth').hidden=false;$('connect').disabled=true;status('Подключено. Войдите под аккаунтом администратора.');const {data}=await client.auth.getSession();if(data.session)await showEditor();}catch(e){status(e.message)}};
async function showEditor(){const {data:{user}}=await client.auth.getUser();if(!user)return;const {data,error}=await client.from('site_settings').select('*').eq('id','main').single();if(error)throw error;$('editor').hidden=false;$('logout').hidden=false;$('login').hidden=true;$('title').value=data.title;$('notice').value=data.notice;for(let i=1;i<=2;i++){const l=data.links?.[i-1]||{};$('name'+i).value=l.name||'';$('link'+i).value=l.url||'';}status('Данные загружены. Публикация доступна только утверждённому администратору.');}
$('login').onclick=async()=>{try{const {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;await showEditor()}catch(e){status(e.message)}};
$('logout').onclick=async()=>{await client.auth.signOut();$('editor').hidden=true;$('logout').hidden=true;$('login').hidden=false;status('Вы вышли из системы')};
$('save').onclick=async()=>{try{const links=[];for(let i=1;i<=2;i++){const name=$('name'+i).value.trim(),raw=$('link'+i).value.trim();if(name||raw){if(!name||!raw)throw Error('Укажите название и URL для каждой ссылки');links.push({name,url:validUrl(raw)})}}const {data,error}=await client.from('site_settings').update({title:$('title').value.trim(),notice:$('notice').value.trim(),links,updated_at:new Date().toISOString()}).eq('id','main').select();if(error)throw error;if(!data?.length)throw Error('Нет права публикации. Проверьте, что пользователь добавлен в site_admins.');status('Опубликовано в базе данных.')}catch(e){status('Ошибка: '+e.message)}};
</script></body></html>
